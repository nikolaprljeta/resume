name: Generate Résumé PDF

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint librsvg2-bin

      - name: Generate PDF
        run: pandoc README.md -o "Nikola Prljeta - Résumé.pdf" --pdf-engine=weasyprint --template=europass.html --lua-filter=resume-filter.lua -t html5

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "Nikola Prljeta - Résumé.pdf"
          git commit -m "Update Résumé PDF" || echo "No changes to commit"
          git push
